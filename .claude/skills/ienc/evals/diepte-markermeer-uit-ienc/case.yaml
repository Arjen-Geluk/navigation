schema_version: "1.1"
name: diepte-markermeer-uit-ienc
expected_outcome: |
  De dieptegebieden (DEPARE) uit de lokale cellen in het vak worden gelezen en de conclusie is dat ze
  in het Markermeer vrijwel allemaal DRVAL1 = 0 zonder DRVAL2 hebben, dus geen bruikbare bathymetrie;
  de RWS-bodemkaart blijft nodig. Eventueel bruikbaar: DRGARE (geulen met projectdiepte) en obstakels met VALSOU.
